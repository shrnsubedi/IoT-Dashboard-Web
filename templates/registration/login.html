{% extends "dashboard/base.html" %}
{% block title %}Log In{% endblock %}

{% block content %}
  <h2>Login</h2>
  <form method="post">
    {% csrf_token %}
    <div class="mb-3">
      <label class="form-label">Username</label>
        {{ form.username }}
    </div>
    <div class="mb-3">
      <label class="form-label">Password</label>
        {{ form.password }}
    </div>
    <button type="submit" class="btn btn-primary">Submit</button>
  </form>
{% endblock %}
