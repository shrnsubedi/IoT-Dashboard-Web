<!-- templates/admin/sensor/room/change_form.html -->
{% extends 'admin/change_form.html' %}

{% block content %}
    {{ block.super }}
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.1/moment.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-moment@^1"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/2.8.0/Chart.min.css" />

    <hr/>
    <div class="module">
        <h2>Temperature Chart</h2>
        <canvas id="temperatureChart" width="800" height="200"></canvas>
    </div>

    <script>
      let temperatureData = {{ temperature_data|safe }};

      let timeLabels = temperatureData.map(function(entry) {
        return moment(entry.time);
      });
      let temperatureValues = temperatureData.map(function(entry) {
        return entry.value;
      });

      let ctx = document.getElementById('temperatureChart').getContext('2d');
      let temperatureChart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: timeLabels,
          datasets: [{
            label: 'Temperature',
            data: temperatureValues,
            borderColor: 'rgba(75, 192, 192, 1)',
            borderWidth: 1,
            fill: false,
          }],
        },
        options: {
          scales: {
            x: {
              type: 'time',
              time: {
                unit: 'hour',
              },
            },
            y: {
              beginAtZero: true,
              ticks: {
                maxTicksLimit: 8,
              },
            },

          },
        },
      });
    </script>
{% endblock %}
