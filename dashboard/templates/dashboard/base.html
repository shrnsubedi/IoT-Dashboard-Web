<!DOCTYPE html>
{% load static %}
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IoT Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"/>
    <link rel="stylesheet" href="{% static 'css/main.css' %}" />
    <style>
      body{
        background-color: #FFFFF0;
        font-family: "Gill Sans", sans-serif;
        margin-left: 8%;
        margin-right: 8%;
      }
      .ul-yellow {
        color: #FFEF65;
      }
      .ul-yellow-bg {
        background-color: #FFEF65;
      }
      .class-room-available{
        background-color: #FAFAD2;
      }
      .hallway{
        background-color: #D3D3D3
      }
      .class-room-taken{
        background-color: #FFFACD;
      }
      .best-room{
        background-color: #98FB98;
      }
      .outside{
        background-color: #FFFFFF
      }
      .other-room{
        background-color: #C0C0C0
      }
      .help-text{
        color: #FFFFF0
      }
      #picture-map{
        display: none;
        overflow: auto;
      }
      #map-container{
          max-height: 58vh;
          overflow-y: auto;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <a class="navbar-brand" href="{% url 'dashboard-landing_page' %}">
          <img src={% static 'dashboard/images/LOGO_UL.png' %}></img>
          <span class="text-white font-weight-bold font-italic">comf*</span><span class="ul-yellow  font-weight-bold font-italic">IoT</span>
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-toggle="collapse"
          data-target="#navbarSupportedContent"
          aria-controls="navbarSupportedContent"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav mr-auto">
            {% if user.is_authenticated %}
            <li class="nav-item">
              <a class="nav-link text-white" href="{% url 'preferences' %}"><i class="fa-solid fa-wrench"></i> Preferences</a>
            </li>
            {% endif %}
          </ul>

          <ul class="navbar-nav ml-auto">
            {% if user.is_authenticated %}
            <li class="nav-item dropdown ml-auto">
              <a
                class="nav-link dropdown-toggle text-white"
                href="#"
                id="navbarDropdown"
                role="button"
                data-toggle="dropdown"
                aria-haspopup="true"
                aria-expanded="false"
              >
                {{user.username}}
              </a>
              <div class="dropdown-menu" aria-labelledby="navbarDropdown">
                <a class="dropdown-item" href="{% url 'logout' %}">Logout</a>
              </div>
            </li>
            {% else %}
            <li class="nav-item">
              <a class="nav-link text-white" href="{% url 'login' %}">Login</a>
            </li>
            <li class="nav-item">
              <a class="nav-link text-white" href="{% url 'signup' %}">Sign Up</a>
            </li>
            {% endif %}
          </ul>
        </div>
      </nav>

      <!--Bootstrap Scripts-->
      <script
        src="https://code.jquery.com/jquery-3.7.1.js"
        integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4="
        crossorigin="anonymous">
      </script>
      <script
        src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"
        integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo"
        crossorigin="anonymous"
      ></script>
      <script
        src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"
        integrity="sha384-OgVRvuATP1z7JjHLkuOU7Xw704+h835Lr+6QL9UvYjZE3Ipu6Tp75j7Bh/kR0JKI"
        crossorigin="anonymous"
      ></script>
      <script src="https://kit.fontawesome.com/4cb3842330.js" crossorigin="anonymous"></script>
      <hr />
      {% block content %} {% endblock content %}
    </div>
    <script src="{% static 'js/main.js' %}"></script>
  </body>
</html>
